# 候補。人が確かめる前のもの。確認日 2026-11-04
#
# 領域: 預け先の事前登録（childcare_registration）。札幌市の公式ページ（kosodate.city.sapporo.jp）から起こした。
# 形は data/README.md の「1 項目の形」に従う。URL はすべて 2026-11-04 に実際に開いて確かめたもの。
# recommended_lead_days（使う前に済ませる目安）は公式ページに書かれた数字ではなく、この候補で置いた値。各項目の notes に明記した。
# 月齢の上限 to は、制度上の上限が就学後まで及ぶものも README に従って 72 にし、制度上の上限は notes に書いた。
items:
