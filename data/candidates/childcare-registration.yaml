        name: "予約システム「テオテ」のアカウント作成ページ（運営: Goodbaton Inc.。2026 年 4 月に「あずかるこちゃん」から名称変更）"
        url: https://sickkids-care.teote.jp/users/sign_in
      - ward: null
        name: "札幌市子ども未来局子育て支援部施設運営課運営調整担当係（電話 011-211-2986、FAX 011-231-6221）"
        url: https://kosodate.city.sapporo.jp/nenrei/mosugu/azukeru/1140.html
    source_url: https://kosodate.city.sapporo.jp/nenrei/mosugu/azukeru/1140.html
    checked_on: 2026-11-04
    evidence: "「事前に予約システム「テオテ」でアカウントを作成し、施設への登録をお願いします」「初回の予約時にアカウント作成してもご利用いただけますが、事前に作成いただくと初回もスムーズにご利用いただけます。」"
    notes: "対象は「生後５か月から小学校６年生まで」（to は README に従い 72）。利用時の条件は、病気で保育園や幼稚園等を利用できない／保護者が仕事などの理由で家庭での保育ができない／かかりつけ医が利用を差し支えないと認めている、の 3 つ。登録そのものに働き方の条件は無いので needs_check は false にした（利用時の条件は説明文に出すか作者に確認）。「以前に紙でこどもデイサービスの利用登録をした方も、改めて「テオテ」での登録が必要です。」アカウント情報・URL は名称変更前から変わっていない。利用時間は月〜土（祝日、12/29〜1/3 を除く）8:00〜18:00、延長なし。予約は「前日の昼12時から予約受付を開始します。」で、かかりつけ医が記入した利用連絡書（発行から 7 日以内のものが有効。発行に費用がかかる場合あり）のデータをアップロードする。先着順ではなく、病気の種類や年齢等で決まる。複数施設への予約は不可。可否は前日夕方または当日 8:30 ごろまでにメールか LINE。キャンセル・変更は当日朝 7 時までにテオテで。令和 8 年 5 月から小樽市・江別市・恵庭市・石狩市・当別町・新篠津村・南幌町・長沼町の住民も利用可（令和 8 年度は試行）。recommended_lead_days 30 はこの候補で置いた目安。ページ下部の更新日は 2022-03-15 だが本文に「令和８年４月28日 更新」とある。関連: sapporo-childcare-byouji-teote-facility、sapporo-childcare-kosodate-info-setsumeikai"

