  # ---------------------------------------------------------------------------
  # さっぽろ子育てサポートセンター（子サポ）。登録（説明会）と、利用前の顔合わせの 2 段階
  # ---------------------------------------------------------------------------
  - id: sapporo-childcare-kosapo-register
    municipality: 札幌市
    domain: childcare_registration
    name: "さっぽろ子育てサポートセンター（子サポ）の依頼会員の登録（登録説明会に参加して会員登録）"
    eligibility:
      age_months: { from: 0, to: 72 }
      work_status: null
      nursery: null
      needs_check: false
    schedule:
      kind: age_start
      start_months: 0
      recommended_lead_days: 0
    prep_days: null
    cost:
      amount: "会員登録は無料。利用料は 30 分あたり、一人目 350 円（月〜金 7 時〜19 時）／400 円（土日祝・年末年始とそれ以外の時間帯）、二人目以降は一人につき 150 円／200 円。提供会員が用意した食事は 1 食 200 円。送迎の交通費、ミルク・おやつ・おむつ等の実費、キャンセル料は別"
      subsidy: null
    contacts:
      - ward: null
        name: "さっぽろ子育てサポートセンター（札幌市社会福祉総合センター内・中央区大通西 19 丁目。電話 011-623-2415、FAX 011-623-4011。受付は月〜金と第 2・第 4 土曜の 8:45〜17:15）"
        url: https://kosodate.city.sapporo.jp/nenrei/mosugu/azukeru/1138.html
    source_url: https://kosodate.city.sapporo.jp/nenrei/mosugu/azukeru/1138.html
    checked_on: 2026-11-04
    evidence: "「依頼会員になるには、原則、事前登録説明会に参加をしていただく必要があります。」「札幌市内に在住または勤務先のある0歳から小学校6年生の子どもを育てている家庭の方で、就労家庭、自営業家庭、専業主婦家庭などすべての子育て家庭が対象です。」"
    notes: "対象は 0 歳〜小学 6 年生（to は README に従い 72）。説明会は 2 通り。(1) センターが実施する説明会: 第 2・4 土曜日 9:30〜10:30、前日 16 時までに申込が要る（令和 8 年度の日程表 PDF: https://kosodate.city.sapporo.jp/material/files/group/16/R8_kosapo3.pdf ）。(2) 各区こそだてインフォメーションの説明会: 平日毎日・予約不要・子サポ／緊サポ／病児保育の 3 事業を一括登録（sapporo-childcare-kosodate-info-setsumeikai）。登録の流れは「Step.1 会員登録: 登録説明会に参加のうえ、会員登録の申し込みを行います。」→ Step.2 利用申し込みと事前打ち合わせ（sapporo-childcare-kosapo-kaoawase）。利用時間は 6:00〜22:00。「必ずしも自分の希望する援助を利用・提供できない場合もあります」。送迎は徒歩または公共交通機関。月齢 0 から対象なので recommended_lead_days は 0。登録に要する日数の記載なし。1138 はスマートフォン版で、PC 版は https://kosodate.city.sapporo.jp/mokuteki/azukeru/ichiji/837.html （同内容、更新日 2026-03-31）"

  - id: sapporo-childcare-kosapo-kaoawase
    municipality: 札幌市
    domain: childcare_registration
    name: "子サポの利用申込と提供会員との事前打ち合わせ（顔合わせ。利用日の 1 か月前から依頼できる）"
    eligibility:
      age_months: { from: 0, to: 72 }
      work_status: null
      nursery: null
      needs_check: false
    schedule:
      kind: age_start
      start_months: 0
      recommended_lead_days: 0
    prep_days: null
    cost:
      amount: "事前打ち合わせの費用の記載は無い。利用料は sapporo-childcare-kosapo-register のとおり（30 分 350 円〜）"
      subsidy: null
    contacts:
      - ward: null
        name: "さっぽろ子育てサポートセンター（電話 011-623-2415。月〜金と第 2・第 4 土曜の 8:45〜17:15）"
        url: https://kosodate.city.sapporo.jp/nenrei/mosugu/azukeru/1138.html
    source_url: https://kosodate.city.sapporo.jp/nenrei/mosugu/azukeru/1138.html
    checked_on: 2026-11-04
    evidence: "「利用日より、1か月前からの依頼調整が可能です。」「依頼会員と提供会員が実際に会って、利用日までに事前打ち合わせを行います。」"
    notes: "前提: sapporo-childcare-kosapo-register（会員登録済み）。流れ: 援助してほしい日時と内容が決まったらセンターに連絡 → センターが条件に合う提供会員を探して紹介（「出来る限り、要望に沿った提供会員をご紹介します」）→ 実際に会って事前打ち合わせ（様式 5 事前打ち合わせ票 PDF: https://kosodate.city.sapporo.jp/material/files/group/16/kosapo_youshiki5.pdf ）→ 「事前打ち合わせで双方が合意した場合、援助活動を行います。」「援助前に会員同士の顔合わせ（マッチング）を行い、原則顔合わせした会員による援助となります。」つまり顔合わせが済むまでは頼めない。期日の決まり方について作者に確認: この候補では登録と同じ age_start 0 にしたが、実際の期日は「使いたい日の 1 か月前から」なので、復職予定日などを起点にする形の方が合う可能性がある"

