    checked_on: 2026-11-04
    evidence: "「※施設への登録はお子さんごとに必要です。」「※複数施設への登録が可能です。自宅周辺だけでなく、勤務先や祖父母宅の近く、通勤経路上の施設にも登録しておくと安心です。」"
    notes: "前提: sapporo-childcare-byouji-teote-account（アカウント作成）。市内の実施施設は病児対応型 5（東区 2・厚別区・豊平区・手稲区）と病後児対応型 1（南区）の計 6 で、どの区の家庭がどの施設に登録できるかの制限は書かれていない（contacts の区は施設の所在区）。症状・疾病によって使える施設が異なる（「受入のめやす」PDF）。市外住民の施設登録が「承認不可」となった例の記載があり、施設登録に施設側の承認の段階があると読めるが、承認までの日数は書かれていない（prep_days は null）。新型コロナ陽性の子の受け入れは天使・北海道の 2 施設のみ（令和 8 年 4 月 1 日から）。recommended_lead_days 30 はこの候補で置いた目安。関連: sapporo-childcare-kosodate-info-setsumeikai（この説明会で病児保育の登録も扱うとされるが、テオテ移行後の運用は要確認）"

