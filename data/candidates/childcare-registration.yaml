        url: https://kosodate.city.sapporo.jp/material/files/group/1/shisetsuitiran0825.pdf
    source_url: https://kosodate.city.sapporo.jp/mokuteki/azukeru/13027.html
    checked_on: 2026-11-04
    evidence: "「利用日時点で下記１及び２のすべてを満たすお子さん（保護者の就労要件は問いません。）」「給付認定申請から決定までは１か月ほど審査のお時間をいただきます。決定後に認定証、利用予約システムのアカウントを発行いたします。」"
    notes: "対象の 2 条件は「1.生後６か月から満３歳未満（３歳の誕生日の前々日まで）」「2.保育所等の施設に在籍していない」（保育所・認定こども園・幼稚園・地域型保育事業所・企業主導型保育施設）。「保護者の就労状況に関係なく、お子さんが定期的に保育所等へ通園でき、保育士等に育児相談も行える子育て支援制度です。」利用は子ども 1 人につき月 10 時間まで（1 時間を最低利用時間、以降 30 分単位、未利用分の繰り越し不可）。流れ: (1) 給付認定申請（ページ内の電子申請フォーム。子ども 1 人ずつ）→ 札幌市の審査おおむね 1 か月 → (2) 「【こども誰でも通園制度総合支援システム】アカウント発行のお知らせ」メール → (3) 総合支援システムで利用希望施設へ事前面談の予約（「原則面談希望日の７日前まで予約申請が可能」。希望者多数のときは希望日に面談できないことがある）→ (4) 事前面談およそ 30〜60 分 → (5) 面談した施設で利用予約。prep_days 30 は認定の審査の分だけで、面談予約〜面談には 7 日以上かかるため recommended_lead_days 45 はこの候補で置いた目安。施設を変えるときは変更先で改めて面談。集団保育が著しく困難と判断された場合は利用できないことがある。受け入れられる日時・人数・年齢は施設ごとに異なる。更新日 2026-10-07（「令和８年１０月７日更新」）"
