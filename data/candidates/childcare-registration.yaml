      subsidy: "生活保護受給世帯・市町村民税非課税世帯は利用料 0 円（給食費 300 円はかかる）。札幌市民は利用前にテオテから減免申請する（年 1 回）。非課税の判定は 4〜8 月利用は前年度、9〜3 月利用は当年度の市町村民税"
    contacts:
