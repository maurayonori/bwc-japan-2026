      basis: "同上。保育所などを利用している回答者のうち、この 1 年間に子どもの病気で普段の保育所などを利用できなかったことが「あった」割合"
    source_url: https://www.fukushi.metro.tokyo.lg.jp/documents/d/fukushi/02gijiroku-pdf
    checked_on: 2026-11-04
    evidence: "この１年間に、子供が病気のため、普段通っている保育所などを利用できなかったことが「あった」という方は、８５．１％となっております。そのときの対応を尋ねますと、下の表のとおりですが「父親や母親が休んだ」が最も多く"
    notes: "確信度: 高（議事録の事務局説明に明記）。東京都の値。「困った経験」というより「使えなかった経験」の割合"

  - id: parent-used-sick-child-care-share
    kind: parent_leave_days
    name: 子の病気で保育所などを使えなかったとき、病児保育を利用した家庭は 18.5%
    applies_to:
