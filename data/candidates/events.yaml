# 候補。人が確かめる前のもの。確認日 2026-11-04。生活のイベントの数字だけ。病気や合併症の確率は書かない。
#
# 形は data/README.md の「起きうること」に従う。
# 決まり（この候補ファイルでの運用）
# - 数字は出典に書いてある値だけ。換算・推定はしない。
# - 出典は公的機関（こども家庭庁・厚生労働省・東京都・札幌市・JIHS 国立健康危機管理研究機構）と
#   査読論文（J-STAGE 収載の東京女子医科大学雑誌）だけ。査読前のプレプリントは notes での言及にとどめ、項目にはしない。
# - URL はすべて 2026-11-04 に実際に開いて確かめたもの。PDF は pdftotext で本文を読んだ。
# - applies_to.months は、出典が月を書いていればその月。出典が週番号で書いている場合は、
#   感染症発生動向調査の報告週（月曜始まり、ISO 週と一致。JIHS の号のタイトルの日付で突合済み）で暦に対応づけた。
#   出典が「夏季」「冬季」など季節語しか書いていない場合は、作業者が 冬季=12〜2 月、夏季=6〜8 月、
#   春から初夏=5〜6 月 と置いた。その項目は notes に「季節語からの対応づけ」と書き、確信度を低くした。
# - measure.stat は README の average / mode / range / share のほかに、定額の給付には fixed を使った（語彙の追加は要相談）。
# - 「確信度」は notes の先頭に書いた（高・中・低）。高=出典に同じ数字が明記、中=出典の図表から読んだ値か対象の違いに注意、
#   低=季節語の対応づけなど作業者の判断が入る。
# - 年齢「0 歳児クラス」などは年度初日（4 月 1 日）の年齢で、年度中に 1 歳上がる。age_months はクラス年齢の範囲で書いた。

events:
  # ------------------------------------------------------------
  # illness_absence: 通園できない日数（保育園に通う子の病欠）
  # 出典: 野原理子・冨澤康子・齋藤加代子「保育園児の病欠頻度に関する研究」東京女子医科大学雑誌 87(5): 146-150, 2017（J-STAGE）
  #   東京都内 3 保育園、2011 年 4 月〜2016 年 3 月の 5 年間、のべ 1,834 名。札幌の保育園の値ではない。
  # ------------------------------------------------------------
  - id: nursery-sick-absence-age-0
    kind: illness_absence
    name: 0 歳児クラスは年およそ 19 日、病気で保育園を休む
    applies_to:
      age_months: { from: 0, to: 11 }
      nursery: true
      months: null
    measure:
      value: 19.3
      unit: 日/年
      stat: average
      basis: "東京都内 3 保育園の 5 年間（2011〜2016 年度）、のべ 1,834 名の出席簿・保健記録。園児 1 人当たりのクラス別年間病欠日数"
    source_url: https://www.jstage.jst.go.jp/article/jtwmu/87/5/87_146/_article/-char/ja
    checked_on: 2026-11-04
    evidence: "園児 1 人当たりのクラス別の年間病欠日数では，0 歳児の病欠日数が最も多く平均で 19.3 日であり，年齢が上がるにつれ平均日数が減少し 5 歳児クラスでは 5.4 日となっていた．"
    notes: "確信度: 高。本文に明記。PDF: https://www.jstage.jst.go.jp/article/jtwmu/87/5/87_146/_pdf/-char/ja 。age_months はクラス年齢（年度初日）で、年度中に 1 歳上がる。札幌ではなく東京の値。同論文が引く新谷ら（外来小児科 16: 84-86, 2013。11 保育園 約 1,300 名）では 0 歳児 30.2 日・5 歳児 7.8 日（原著は未入手、2017 年論文の考察での引用で確認）"

  - id: nursery-sick-absence-age-1
    kind: illness_absence
    name: 1 歳児クラスは年およそ 13 日、病気で保育園を休む
    applies_to:
      age_months: { from: 12, to: 23 }
      nursery: true
      months: null
    measure:
      value: 12.8
      unit: 日/年
      stat: average
      basis: "同上。Fig. 1（クラス別の年間病欠日数）の 1-year-old class の値"
    source_url: https://www.jstage.jst.go.jp/article/jtwmu/87/5/87_146/_article/-char/ja
    checked_on: 2026-11-04
    evidence: "Fig. 1 Average annual numbers of days of absence due to illness per person by class: 0-year-old class 19.3 / 1-year-old class 12.8 / 2-year-old class 8.9 / 3-year-old class 7.0 / 4-year-old class 6.5 / 5-year-old class 5.4 (days)"
    notes: "確信度: 中。本文には 0 歳と 5 歳の値しか無く、1〜4 歳は Fig. 1 の棒グラフに付いた数値ラベルを読んだ（PDF 148 ページ）。東京都 病児保育部会 議事録の「1 歳児だとおよそ 12 日間」は、この論文か、同じ著者の前回調査（野原・加藤 2011、東京女子医科大学雑誌 81: 408-415。1 歳児クラス 12 日）を指すと見られる（nursery-sick-absence-age-1-prior-study を参照）。参考: 査読前プレプリント（野原ほか、Jxiv 1534、保育園サーベイランス）では 1 歳児の年間病欠日数は M 市 11.1 日・S 区 7.1 日（年 243 登園日想定）。査読前なので項目にはしていない"

  - id: nursery-sick-absence-age-2
    kind: illness_absence
    name: 2 歳児クラスは年およそ 9 日、病気で保育園を休む
    applies_to:
      age_months: { from: 24, to: 35 }
      nursery: true
      months: null
    measure:
      value: 8.9
      unit: 日/年
      stat: average
      basis: "同上。Fig. 1 の 2-year-old class の値"
    source_url: https://www.jstage.jst.go.jp/article/jtwmu/87/5/87_146/_article/-char/ja
    checked_on: 2026-11-04
    evidence: "Fig. 1 Average annual numbers of days of absence due to illness per person by class: 2-year-old class 8.9 (days)。本文: 年齢が上がるにつれ平均日数が減少し 5 歳児クラスでは 5.4 日となっていた．"
    notes: "確信度: 中。図の数値ラベルから読んだ値。東京の 3 園の値"

  - id: nursery-sick-absence-age-3
    kind: illness_absence
    name: 3 歳児クラスは年およそ 7 日、病気で保育園を休む
    applies_to:
      age_months: { from: 36, to: 47 }
      nursery: true
      months: null
    measure:
      value: 7.0
      unit: 日/年
      stat: average
      basis: "同上。Fig. 1 の 3-year-old class の値"
    source_url: https://www.jstage.jst.go.jp/article/jtwmu/87/5/87_146/_article/-char/ja
    checked_on: 2026-11-04
    evidence: "Fig. 1 Average annual numbers of days of absence due to illness per person by class: 3-year-old class 7.0 (days)。本文: 3 歳以降では全体に日数も少なく月別の変動も小さかった．"
    notes: "確信度: 中。図の数値ラベルから読んだ値。東京の 3 園の値"

  - id: nursery-sick-absence-age-4
    kind: illness_absence
    name: 4 歳児クラスは年およそ 6〜7 日、病気で保育園を休む
    applies_to:
      age_months: { from: 48, to: 59 }
      nursery: true
      months: null
    measure:
      value: 6.5
      unit: 日/年
      stat: average
      basis: "同上。Fig. 1 の 4-year-old class の値"
    source_url: https://www.jstage.jst.go.jp/article/jtwmu/87/5/87_146/_article/-char/ja
    checked_on: 2026-11-04
    evidence: "Fig. 1 Average annual numbers of days of absence due to illness per person by class: 4-year-old class 6.5 (days)"
    notes: "確信度: 中。図の数値ラベルから読んだ値。東京の 3 園の値"

  - id: nursery-sick-absence-age-5
    kind: illness_absence
    name: 5 歳児クラスは年およそ 5 日、病気で保育園を休む
    applies_to:
      age_months: { from: 60, to: 72 }
      nursery: true
      months: null
    measure:
      value: 5.4
      unit: 日/年
      stat: average
      basis: "同上。本文に明記された 5 歳児クラスの値"
    source_url: https://www.jstage.jst.go.jp/article/jtwmu/87/5/87_146/_article/-char/ja
    checked_on: 2026-11-04
    evidence: "0 歳児の病欠日数が最も多く平均で 19.3 日であった．年齢が上がるにつれ平均日数が減少し 5 歳児クラスでは 5.4 日となっていた．"
    notes: "確信度: 高。本文に明記。東京の 3 園の値"

  - id: nursery-sick-absence-april-after-entry
    kind: illness_absence
    name: 年度替わりの 4 月は病欠がやや多い（入園直後の環境の変化）
    applies_to:
      age_months: null
      nursery: true
      months: [4]
    measure:
      value: 1.0
      unit: 日/月
      stat: average
      basis: "同上。Fig. 2（園児 1 人当たりの月別病欠日数）の April の値。年間の月別の幅は 0.7〜1.1 日"
    source_url: https://www.jstage.jst.go.jp/article/jtwmu/87/5/87_146/_article/-char/ja
    checked_on: 2026-11-04
    evidence: "年度替わりの 4 月ではやや欠席人数が多く，これは環境の変化による影響が考えられた．／前回調査と同様に本調査結果からも，入園 1 年目で病欠日数が多いことが明確となった"
    notes: "確信度: 中。「入園後の最初の数か月に病欠が多い」ことを直接測った日本の研究は見つからなかった。この論文は年度替わりの 4 月の欠席がやや多いこと（Fig. 2 で 4 月 1.0 日）と、入園 1 年目（0 歳児クラス）の病欠が多いことを述べているだけで、入園後 N か月の推移は示していない。入園予定月のレバーに使うなら「入園した月の前後」の目安としてだけ出す"

  - id: nursery-sick-absence-peak-july
    kind: illness_absence
    name: 病欠は 7 月が最も多く、6 月が最も少ない（0 歳は 7 月と 12 月、1 歳は 7 月）
    applies_to:
      age_months: null
      nursery: true
      months: [7]
    measure:
      value: 1.1
      unit: 日/月
      stat: average
      basis: "同上。Fig. 2 の月別病欠日数。7 月 1.1 日が最多、6 月 0.7 日が最少"
    source_url: https://www.jstage.jst.go.jp/article/jtwmu/87/5/87_146/_article/-char/ja
    checked_on: 2026-11-04
    evidence: "7 月が最も多く 1.1 日，6 月が最も少なく 0.7 日であった．／0 歳児では 7 月と 12 月の欠席が多く，1 歳児は 7 月が多かった．3 歳以降では全体に日数も少なく月別の変動も小さかった．"
    notes: "確信度: 高（本文に明記）。流行期のレーンと重ねるときの裏づけ。論文は 7 月をアデノ・コクサッキー、12 月を RS・ノロ・ロタ、2 月をインフルエンザの流行時期と対応づけて「予想」と書いている（病名は推察なので画面には出さない）"

  - id: nursery-sick-absence-age-1-prior-study
    kind: illness_absence
    name: 1 歳児は年およそ 12 日、保育園に通えない（東京都 病児保育部会での先行研究への言及）
    applies_to:
      age_months: { from: 12, to: 23 }
      nursery: true
      months: null
    measure:
      value: 12
      unit: 日/年
      stat: average
      basis: "通園児童の休園日数を調査した先行研究への言及（東京都子供・子育て会議 病児保育部会 第 2 回 議事録、園田委員の発言）"
    source_url: https://www.fukushi.metro.tokyo.lg.jp/documents/d/fukushi/02gijiroku-pdf
    checked_on: 2026-11-04
    evidence: "通園児童の休園日数を調査する先行研究では、１歳児だとおよそ１２日間と示されており、兄弟姉妹がいる家庭では、保育園に通園できない日数はより増えると想像できます。"
    notes: "確信度: 中。議事録は先行研究名を挙げていない。該当すると見られる研究は 2 つ: (1) 野原・加藤 2011（東京女子医科大学雑誌 81: 408-415。1 保育園 約 180 名、0 歳児クラス 24 日・1 歳児クラス 12 日。原著は J-STAGE で見つからず、野原 2017 の緒言での引用で確認）、(2) 野原ほか 2017（3 保育園、1 歳児クラス 12.8 日。nursery-sick-absence-age-1）。兄弟がいると日数が増えることは「想像できます」という発言で、数字は無い。兄弟の影響を数字で示した日本の研究は今回見つからなかった"

  # ------------------------------------------------------------
  # parent_leave_days: 親が休む日数と、預け先に困った経験
  # 出典: 第 2 回 東京都子供・子育て会議 病児保育部会 議事録（令和 8 年 9 月 8 日）。保護者ニーズ調査（約 11 万人に送付、6,181 人が回答）
  # ------------------------------------------------------------
  - id: parent-leave-days-mother-mode
    kind: parent_leave_days
    name: 子の病気で母が仕事を休む日数は、年 6〜10 日の人が最も多い
    applies_to:
      age_months: null
      nursery: true
      months: null
    measure:
      value: "6〜10"
      unit: 日/年
      stat: mode
      basis: "東京都の保護者ニーズ調査（2026 年 7 月実施、6,181 人回答）。この 1 年間に子どもの病気で父親や母親が休んだ日数"
    source_url: https://www.fukushi.metro.tokyo.lg.jp/documents/d/fukushi/02gijiroku-pdf
    checked_on: 2026-11-04
    evidence: "母親が休む日数のボリュームゾーンは６～１０日。父親のボリュームゾーンは、２日と５日となっています。また、母親が休む日数６～１０日、１１～２０日も父親と比較して高い割合となっており、母親により負担が寄っていることが本調査でも明らかになったと思いました。"
    notes: "確信度: 中。議事録の委員発言で、各階級の割合（%）は資料 2 にあり議事録には無い。東京都の調査で、札幌の値ではない。回答者の約 6 割が保育所などを利用中（議事録 2 ページ目の説明）。nursery: true は回答の母集団に合わせた目安で、未就園の家庭にも出すなら null にする"

  - id: parent-leave-days-father-mode
    kind: parent_leave_days
    name: 子の病気で父が仕事を休む日数は、年 2 日と 5 日の人が最も多い
    applies_to:
      age_months: null
      nursery: true
      months: null
    measure:
      value: "2 と 5"
      unit: 日/年
      stat: mode
      basis: "同上。父親が休んだ日数の最頻値が 2 つ（2 日と 5 日）"
    source_url: https://www.fukushi.metro.tokyo.lg.jp/documents/d/fukushi/02gijiroku-pdf
    checked_on: 2026-11-04
    evidence: "母親が休む日数のボリュームゾーンは６～１０日。父親のボリュームゾーンは、２日と５日となっています。"
    notes: "確信度: 中。同上。同じ委員は看護休暇が子 1 人につき 5 日であることに触れている（「看護休暇は、私の知る限り、お子さん１人につき５日間ですので、この方々は、超えた分を場合によっては有給休暇で対応されているのだと思います。」）"

  - id: parent-unable-to-use-nursery-share
    kind: parent_leave_days
    name: この 1 年に、子の病気でいつもの保育所などを使えなかった家庭は 85.1%
    applies_to:
      age_months: null
      nursery: true
      months: null
    measure:
