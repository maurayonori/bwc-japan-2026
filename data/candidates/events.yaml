    checked_on: 2026-11-04
    evidence: "「子供が病気で保育所等を利用できなかったことがある」が８５．１％。そのときに「病児保育を利用した」のは１８．５％となっております。"
    notes: "確信度: 高。東京都の値。同じ資料で「利用した日数よりも、もっと利用したかった」が 54.7%"

  - id: parent-not-preregistered-sick-child-care-share
    kind: parent_leave_days
    name: 病児保育に事前登録していない家庭は 66.5%
    applies_to:
      age_months: null
      nursery: null
      months: null
    measure:
      value: 66.5
      unit: "%"
      stat: share
      basis: "同上。病児保育の事前登録の状況"
    source_url: https://www.fukushi.metro.tokyo.lg.jp/documents/d/fukushi/02gijiroku-pdf
    checked_on: 2026-11-04
    evidence: "事前登録の状況を聞きますと、下の表のとおり、事前登録をしていない方が６６．５％となっております。／資料の一部修正がございまして、左側の箱の一番上「事前登録をしていない」は、正しくは「６６．５％」でございます。"
    notes: "確信度: 高。東京都の値で、札幌市のテオテの登録率ではない。ADR 0004 の「登録を先に済ませる」の裏づけに使える。kind は 5 種類に合うものが無く parent_leave_days に置いた（要相談）"

  # ------------------------------------------------------------
  # epidemic_season: 流行期（全国の感染症発生動向調査。JIHS 国立健康危機管理研究機構）
  # ------------------------------------------------------------
  - id: epidemic-influenza
    kind: epidemic_season
    name: インフルエンザの流行期（11 月〜2 月。直近はピークが 11 月下旬と 2 月上旬の 2 回）
    applies_to:
      age_months: null
      nursery: null
      months: [11, 12, 1, 2]
    measure:
      value: "2025 年第 47 週（51.12）と 2026 年第 6 週（43.34）"
      unit: ピーク週（定点当たり報告数）
      stat: mode
      basis: "IDWR 2026 年第 35 号 注目すべき感染症 インフルエンザ。2022/23〜2025/26 シーズンの全国のピーク週"
    source_url: https://id-info.jihs.go.jp/surveillance/idwr/featured/2026/35/index.html
    checked_on: 2026-11-04
    evidence: "2025/26 シーズンは 2025 年第 39 週に全国の定点当たり報告数が 1.00 を超え、二峰性の流行を呈し、2025 年第 47 週（51.12）と 2026 年第 6 週（43.34）にピーク。過去のピーク: 2022/23 は 2023 年第 6 週（12.91）、2023/24 は 2023 年第 49 週（33.72）、2024/25 は 2024 年第 52 週（64.39）"
