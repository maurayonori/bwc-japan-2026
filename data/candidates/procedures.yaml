    evidence: "「認可保育所、認定こども園、幼稚園などを利用する小学校就学前の3年間（3〜5歳児クラス）のお子さま、および住民税非課税世帯の0〜2歳児クラスのお子さまを対象とした利用料の無償化のほか、」「月額25,700円(令和8年10月からは28,000円)を上限に無償（施設に給付）」"
    notes: "手続きは施設の種類で違う。認可保育所・認定こども園（保育所部分）は教育・保育給付認定（2 号・3 号）、認定こども園（幼稚園部分）は 1 号で、無償化のための別の申請はページに記載なし。幼稚園の預かり保育・認可外保育施設（ベビーシッター含む）などは施設等利用給付認定が要り、新 1 号（満 3 歳以上。保育の必要性不要）、新 2 号（3 歳児クラス以上。保育の必要性が必要）、新 3 号（2 歳児クラス以下。保育の必要性が必要で住民税非課税世帯のみ）。「必ず事前に申請してください。」「申請書を札幌市で受付した日よりさかのぼって認定することはできません。」。提出先は私学助成幼稚園なら利用する園、認可外保育施設なら子ども・子育て支援事務センター。「幼稚園や認定こども園（幼稚園部分）は満3歳から対象」で、保育所の 3 歳児クラスは 4 月 1 日時点の年齢で決まる（年度の境）。start_months 36 は満 3 歳に合わせた目安で、年度で計算するかは作者が決める。recommended_lead_days 30 も目安。要確認: 利用する施設の種類と保育の必要性。ページ更新日 2026-07-28（7504・8728 とも）"

