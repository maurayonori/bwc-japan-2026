        url: https://www.mhlw.go.jp/content/11600000/001461102.pdf
    source_url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000158500.html
    checked_on: 2026-11-04
    evidence: "初回の申請期限は「受給資格確認手続のみ行う場合は初回の支給申請を行う日まで、初回の支給申請も同時に行う場合は育児休業開始日から４か月を経過する日の属する月の末日まで」。支給率は「67％（ただし、育児休業の開始から181日目以降は50％）」"
    notes: "要確認: 雇用保険の被保険者で、「育児休業を開始した日前２年間に賃金支払基礎日数が11日以上ある（ない場合は就業した時間数が80時間以上の）月が12か月以上あること。」。自営業は対象外。start_days 58 は母の育児休業開始日（厚労省リーフレット 2026-08-01 改訂版 p.19: 産後休業のあと引き続き育休を取る場合「育児休業開始日」は出生日から起算して 58 日目）で、父は休業開始日が別なので目安。初回の申請期限は育児休業開始日から 4 か月を経過する日の属する月の末日（例: 7/10 開始なら 11/30 まで）。2 回目以降はハローワークが指定する支給申請期間内に原則 2 か月ごと（本人が希望すれば 1 か月ごとも可）。2 か月ごとの繰り返しは after_previous（days_after: 60）で表す案もあり、作者が決める。受給資格確認票・（初回）支給申請書にはマイナンバーを記載。延長は kuni-procedures-ikuji-kyugyo-kyufu-encho。Q&A ページは「令和８年８月版」、リーフレット「育児休業等給付の内容と支給申請手続」は 2026-08-01 改訂版（ https://www.mhlw.go.jp/content/11600000/001461102.pdf ）"

