    notes: "2025 年（令和 7 年）4 月 1 日創設。対象期間は、産後休業をしていない親（父など）は「子の出生日または出産予定日のうち早い日」から「遅い日から起算して 8 週間を経過する日の翌日」まで、産後休業をした母は同じ起点から 16 週間。deadline_days 56 は出生日が出産予定日と同じ場合の 8 週間で、予定日より早く生まれた場合は予定日が起点になるので実際はもう少し長い。母は 112 日を使う。もう 1 つの要件は、配偶者も同じ期間に通算 14 日以上の育児休業を取ったこと、または子の出生日の翌日において「配偶者の育児休業を要件としない場合」（1 配偶者がいない、2 配偶者が子と法律上の親子関係がない、3 配偶者から暴力を受け別居中、4 配偶者が無業者、5 配偶者が自営業者やフリーランスなど雇用される労働者でない、6 配偶者が産後休業中、7 その他の理由で配偶者が育児休業をすることができない）に当たること。出生時育児休業給付金・出生後休業支援給付金の申請は、子の出生日（予定日前に出生した場合は出産予定日）から 8 週間を経過する日の翌日から可能で、期限は申請開始日から 2 か月を経過する日の属する月の末日。要確認: 雇用保険の被保険者か、配偶者の就労状況。関連: kuni-procedures-sango-papa-ikukyu。リーフレット 2026-08-01 改訂版 p.1-2・13-14"

