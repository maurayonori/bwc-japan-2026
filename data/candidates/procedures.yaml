    notes: "延長の手続き自体は「延長する期間の直前の支給単位期間の支給申請時（ただし１歳又は１歳６か月に達する日以降の申請時に限る。）」に書類を出す（Q17）。「1歳に達する日」は「１歳の誕生日の前日をいいます」。実際に期日になるのは保育所の申込みで、入所希望日を 1 歳の誕生日以前にする必要があり（Q22）、札幌市は希望日の 2 か月前までに申込む（sapporo-procedures-hoikusho-nendotochu）。deadline_days 305 は「1 歳の誕生日の 2 か月前」を日数に直した目安で、start_days 180 も目安。月単位で計算するなら作者が決める。有期雇用の場合は 1 歳到達日の翌日において 1 歳 6 か月までの間に労働契約が満了することが明らかでないことも要件。市区町村が募集していない時期のため申込み可能な希望日で申し込んだ場合は延長が認められる可能性がある（Q22）"

