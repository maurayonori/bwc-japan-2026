        name: "各区健康・子ども課（保健センター）。電話番号は出典ページの末尾に区ごとに掲載"
        url: https://www.city.sapporo.jp/hokenjo/f1kansen/fy01yobousessyu.html
    source_url: https://www.city.sapporo.jp/hokenjo/f1kansen/fy01yobousessyu.html
    checked_on: 2026-11-04
    evidence: "「任意予防接種は、医師と相談の上、接種者や保護者の判断により接種するもので、接種費用は自己負担となります。」「主な任意予防接種の種類」の表、季節性インフルエンザワクチンの行:「6か月以上」「生後6か月～13歳未満：2回」「13歳以上：1回」「※市販されている一部のワクチンは1歳以上の接種となります。」"
    notes: "札幌市の小児助成は無し（2026-11-04 確認。予防接種全般ページの任意接種一覧で「自己負担」。市のサイトに小児向けインフルエンザ助成のページは無く、定期接種は高齢者のみ）。費用は医療機関ごとに異なる（厚生労働省「インフルエンザワクチン（季節性）」Q&A 2025-12-19 版: 原則全額自己負担、費用は医療機関によって異なる。https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/kekkaku-kansenshou/yobou-sesshu/vaccine/influenza/index.html ）。時期の根拠: 小児向けの公式な接種期間は無いので、札幌市の令和 8 年度高齢者インフルエンザ定期予防接種の実施期間「令和8年10月1日（木曜日）～令和9年1月31日（日曜日）」と同じ期間を置いた（ https://www.city.sapporo.jp/hokenjo/f1kansen/fy04koureiinflu.html 2026-10-06 更新）。厚生労働省「令和８年度冬季 急性呼吸器感染症（ARI）総合対策に関するQ&A」（令和8年9月30日版）Q27 は「12月中旬までにワクチン接種を終えることが望ましいと考えられます」とし、流行は例年 12 月〜3 月頃としている（ https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/kekkaku-kansenshou/infulenza/QA2026.html ）。end を 12-15 にする案もある。年をまたぐ期間なので計算の扱いを確認。一部の製品は 1 歳以上から。2 回目は sapporo-vaccines-influenza-second。"

