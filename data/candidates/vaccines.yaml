# - 三種混合（DPT）・不活化ポリオ（IPV）の就学前の追加接種（5〜6 歳）:
#   厚生労働省・札幌市のページに「就学前に任意で追加接種できる」という記載が見つからなかった。
#   厚生労働省の事務連絡（令和 8 年 4 月 27 日 https://www.mhlw.go.jp/content/001695990.pdf ）は
#   三種混合ワクチンを「成人等への任意接種に用いることが可能」とし、令和 8 年 4 月 20 日に出荷調整を解除したと書くだけ。
#   JIHS「日本で接種可能なワクチンの種類」は「定期接種ワクチンを定期接種対象年齢以外で受ける場合は任意接種となります」とする。
#   日本小児科学会のスケジュールには 5 歳以上 7 歳未満での三種混合・不活化ポリオの任意接種の推奨があるが、出典にはしない決まり。
