# 候補。人が確かめる前のもの。確認日 2026-11-04。接種するかの判断は親と医師のもの
#
# 領域: 任意接種の時期と費用（domain: vaccines）
# - 「この月齢から受けられる」「何回・間隔」「費用・助成・窓口」としてだけ書く。「打つべき」「おすすめ」は使わない（ADR 0003）
# - 定期接種（ロタ・B 型肝炎・五種混合・Hib・小児肺炎球菌・BCG・MR・水痘・日本脳炎・HPV）は入れない。母子モにある
# - 出典は公式のみ。費用は公的機関が示す額だけを書き、医療機関ごとの掲示は書かない
# - URL はすべて 2026-11-04 に実際に開いて確かめた
# - 項目にしなかったもの（三種混合・不活化ポリオの就学前追加、RS ウイルスの抗体製剤と母子免疫ワクチン、骨髄移植等の再接種助成）は末尾のコメントに書いた

