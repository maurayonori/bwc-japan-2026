    checked_on: 2026-11-04
    evidence: "「主な任意予防接種の種類」の表、新型コロナワクチンの行:「6か月以上」「1回」「※接種についての詳細は接種医にご相談ください。」「任意予防接種は、医師と相談の上、接種者や保護者の判断により接種するもので、接種費用は自己負担となります。」"
