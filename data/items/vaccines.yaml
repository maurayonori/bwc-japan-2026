    source_url: https://id-info.jihs.go.jp/surveillance/iasr/IASR/Vol46/549/549r04.html
    checked_on: 2026-11-04
    evidence: "「また, 生後6か月から任意接種として接種が可能で, 13歳未満の小児においては2～4週間の間隔をおいて毎シーズン2回の接種が推奨されている。」（IASR Vol.46 p222-224、2025 年 11 月号「2024年度感染症流行予測調査におけるインフルエンザ予防接種状況および抗体保有状況（2025年9月現在）」）"
    notes: "間隔は 2〜4 週（14〜28 日）。days_after は上限の 28 日を置いた。14 日にするかは作者判断。札幌市の予防接種全般ページ（ https://www.city.sapporo.jp/hokenjo/f1kansen/fy01yobousessyu.html 2026-09-11 更新）の任意接種一覧でも「生後6か月～13歳未満：2回」。厚生労働省の Q&A（2025-12-19 版）は「13歳未満の方は、２回接種です。」とするが接種間隔の記載は無い。札幌市の小児助成は無し（2026-11-04 確認）。費用は医療機関ごとに異なる。1 回目は sapporo-vaccines-influenza-first。"

